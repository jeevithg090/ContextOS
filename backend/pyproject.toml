[project]
name = "contextos-server"
version = "0.1.0"
description = "ContextOS — security, trust, provenance and observability layer for autonomous AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  # Floors for transitive packages with published vulnerabilities in older releases
  # (fastapi/uvicorn alone would still allow them).
  "starlette>=0.49.1",
  "h11>=0.16",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
contextos-server = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Run from backend/ as its own pytest process (`make test-backend`); never in the same process as
# sdk/tests (both are packages named `tests`; see the root Makefile).
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
