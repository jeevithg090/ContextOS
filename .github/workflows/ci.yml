name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend + SDK (lint, test, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            sdk/pyproject.toml
      - name: Install backend and SDK
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e "backend[dev,postgres]" -e "sdk[mcp]"
      - name: Lint and format check
        run: make lint-backend
      - name: Check migrations match the models
        working-directory: backend
        run: |
          export CONTEXTOS_DATABASE_URL="sqlite:///$RUNNER_TEMP/migrations.db"
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: Backend tests
        run: make test-backend
      - name: SDK tests
        run: make test-sdk
      - name: Script tests
        run: make test-scripts
      - name: Whole-system smoke run
        run: make smoke

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t contextos:ci .
