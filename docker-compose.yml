# ContextOS with PostgreSQL 17.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD and CONTEXTOS_SECRET_KEY
#   docker compose up --build
#   docker compose exec app contextos-server create-org --name "Acme AI" --email owner@example.com --name-of-owner "Ada"
#
# The app applies pending migrations (`contextos-server init-db`) every time it starts, then serves the
# API and the web UI on http://127.0.0.1:${CONTEXTOS_PORT:-8080}. Put it behind TLS for anything but a
# local trial (CONTEXTOS_COOKIE_SECURE=true requires HTTPS outside localhost).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contextos}
      POSTGRES_USER: ${POSTGRES_USER:-contextos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: contextos:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Built from the POSTGRES_* values above; use a URL-safe password (e.g. `openssl rand -hex 24`).
      CONTEXTOS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contextos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-contextos}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "contextos-server init-db && exec contextos-server serve --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${CONTEXTOS_PORT:-8080}:8000"

volumes:
  pgdata:
