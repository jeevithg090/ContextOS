[project]
name = "contextos"
version = "0.1.0"
description = "ContextOS Python SDK, CLI and agent integrations (Claude Code hooks, MCP gateway)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
contextos = "contextos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextos"]
